    <style>
        /* 教科書体を優先するフォント設定 */
        .font-kyokasho {
            font-family: 
                "UD Digi Kyokasho N-R", 
                "UD デジタル 教科書体 N-R", 
                "UDDigiKyokashoN-R",
                "Kyokasho HD",

                "Klee One", 
                serif;

        /* 小学校教科書スタイルのアルファベット（1階建てのa, gなど） */
        .font-romaji {
            font-family: 'Andika', 'M PLUS Rounded 1c', sans-serif;

        /* 全体 UI 用のフォント（読みやすい丸ゴシック） */

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('touchstart', initAudio, { once: true });
        window.addEventListener('click', initAudio, { once: true });

        // Global States
        let currentFilter = 'seion';
        let currentCase = 'lower'; // 'lower' or 'upper'
        let currentQuizCategory = 'all'; // 'all', 'seion', 'dakuon', 'youon'

        // Format helper to reflect uppercase / lowercase setting
        function formatRomaji(str) {
            if (!str) return '';
            return currentCase === 'upper' ? str.toUpperCase() : str.toLowerCase();
        }

        // Toggle Letter Case (Lower vs Upper)
        function setLetterCase(letterCase) {
            currentCase = letterCase;
            const lowerBtn = document.getElementById('caseLowerBtn');
            const upperBtn = document.getElementById('caseUpperBtn');

            if (letterCase === 'lower') {
                lowerBtn.className = 'px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-sm md:text-base transition-all bg-white text-emerald-700 shadow';
                upperBtn.className = 'px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-sm md:text-base transition-all text-emerald-100 hover:text-white';
            } else {
                upperBtn.className = 'px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-sm md:text-base transition-all bg-white text-emerald-700 shadow';
                lowerBtn.className = 'px-3 md:px-4 py-1.5 rounded-xl font-extrabold text-sm md:text-base transition-all text-emerald-100 hover:text-white';
            }

            // Refresh Current View Elements
            renderChart(currentFilter);
            if (!document.getElementById('contentQuiz').classList.contains('hidden')) {
                loadNextQuizQuestion();
            }
            if (!document.getElementById('contentTyping').classList.contains('hidden')) {
                setupTypingWord();
            }

            { kana: 'すし', icon: '🍣', romaji: 'sushi' },
            { kana: 'ちず', icon: '🗺️', romaji: 'chizu' },
            { kana: 'ほし', icon: '⭐', romaji: 'hoshi' },

        ];

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'tap') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        function speakText(text, lang = 'ja-JP') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function switchTab(tab) {
            playSound('tap');
            document.getElementById('contentChart').classList.add('hidden');
            document.getElementById('contentQuiz').classList.add('hidden');
            document.getElementById('contentTyping').classList.add('hidden');

            const inactiveStyle = 'tab-btn flex-1 py-3 md:py-4 px-3 text-center font-bold text-slate-400 border-b-4 border-transparent hover:text-emerald-500 flex items-center justify-center gap-2 text-base md:text-xl rounded-t-xl transition-all';
            const activeStyle = 'tab-btn flex-1 py-3 md:py-4 px-3 text-center font-bold text-emerald-600 border-b-4 border-emerald-500 flex items-center justify-center gap-2 text-base md:text-xl rounded-t-xl transition-all';

            document.getElementById('tabChart').className = inactiveStyle;
            document.getElementById('tabQuiz').className = inactiveStyle;
            document.getElementById('tabTyping').className = inactiveStyle;

            if (tab === 'chart') {
                document.getElementById('contentChart').classList.remove('hidden');
                document.getElementById('tabChart').className = activeStyle;
            } else if (tab === 'quiz') {
                document.getElementById('contentQuiz').classList.remove('hidden');
                document.getElementById('tabQuiz').className = activeStyle;
                loadNextQuizQuestion();
            } else if (tab === 'typing') {
                document.getElementById('contentTyping').classList.remove('hidden');
                document.getElementById('tabTyping').className = activeStyle;
                setupTypingWord();
            }
        }

        function renderChart(filter) {
            currentFilter = filter;
            const grid = document.getElementById('chartGrid');
            grid.innerHTML = '';

            const filterBtns = {
                'seion': document.getElementById('filterBtnSeion'),
                'dakuon': document.getElementById('filterBtnDakuon'),
                'youon': document.getElementById('filterBtnYouon')
            };

            Object.keys(filterBtns).forEach(key => {
                if (key === filter) {
                    filterBtns[key].className = 'chart-filter-btn flex-1 md:flex-none px-5 py-2.5 bg-emerald-500 text-white font-extrabold rounded-2xl text-base md:text-lg shadow-md transition';
                } else {
                    filterBtns[key].className = 'chart-filter-btn flex-1 md:flex-none px-5 py-2.5 bg-white text-emerald-800 font-extrabold rounded-2xl text-base md:text-lg border-2 border-emerald-200 transition';
                }
            });

            const items = romajiData[filter];
            grid.className = filter === 'youon' ? 'grid grid-cols-3 gap-3 md:gap-4' : 'grid grid-cols-5 gap-3 md:gap-4';

            items.forEach(item => {
                if (!item.kana) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'bg-slate-100/40 rounded-3xl min-h-[90px] md:min-h-[115px]';
                    grid.appendChild(emptyDiv);
                    return;
                }

                const card = document.createElement('button');
                card.className = 'bg-white hover:bg-emerald-50 active:bg-emerald-100 border-2 border-emerald-100 hover:border-emerald-300 rounded-3xl p-2 md:p-4 text-center shadow-sm hover:shadow-md transition flex flex-col items-center justify-center min-h-[90px] md:min-h-[115px] bouncy';
                card.onclick = () => {
                    playSound('tap');
                    speakText(item.kana, 'ja-JP');
                };

                card.innerHTML = `
                    <span class="font-kyokasho text-sm md:text-base font-semibold text-slate-500 -mb-1">${item.kana}</span>
                    <span class="font-romaji text-3xl md:text-5xl font-black text-emerald-600 tracking-wide">${formatRomaji(item.romaji)}</span>
                `;
                grid.appendChild(card);
            });
        }

        let quizScore = 0;
        let currentQuizItem = null;

        // Set Quiz Category Filter
        function setQuizFilter(category) {
            playSound('tap');
            currentQuizCategory = category;

            const categoryBtns = {
                'all': document.getElementById('quizFilterAll'),
                'seion': document.getElementById('quizFilterSeion'),
                'dakuon': document.getElementById('quizFilterDakuon'),
                'youon': document.getElementById('quizFilterYouon')
            };

            Object.keys(categoryBtns).forEach(key => {
                if (key === category) {
                    categoryBtns[key].className = 'quiz-filter-btn px-4 py-2 bg-amber-500 text-white font-extrabold rounded-2xl text-sm md:text-base shadow-sm transition';
                } else {
                    categoryBtns[key].className = 'quiz-filter-btn px-4 py-2 bg-white text-amber-900 font-extrabold rounded-2xl text-sm md:text-base border-2 border-amber-200 transition';
                }
            });

            loadNextQuizQuestion();
        }

        function loadNextQuizQuestion() {
            const feedback = document.getElementById('quizFeedback');
            feedback.classList.add('hidden');

            // 出題対象アイテムの絞り込み
            let pool = [];
            if (currentQuizCategory === 'all') {
                pool = [...romajiData.seion, ...romajiData.dakuon, ...romajiData.youon];
            } else {
                pool = romajiData[currentQuizCategory] || [];
            }
            const activeItems = pool.filter(x => x.kana !== '');

            // ダミー選択肢作成用に全体からも取得
            const allItems = [...romajiData.seion, ...romajiData.dakuon, ...romajiData.youon].filter(x => x.kana !== '');

            currentQuizItem = activeItems[Math.floor(Math.random() * activeItems.length)];

            document.getElementById('quizKana').textContent = currentQuizItem.kana;

            const correctAnswer = formatRomaji(currentQuizItem.romaji);
            const choices = new Set([correctAnswer]);

            while (choices.size < 4) {
                const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
                const choiceText = formatRomaji(randomItem.romaji);
                if (choiceText !== correctAnswer) {
                    choices.add(choiceText);
                }
            }

            const shuffledChoices = Array.from(choices).sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            shuffledChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'font-romaji bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 border-2 border-emerald-200 text-emerald-900 font-black text-4xl md:text-5xl py-6 md:py-8 rounded-3xl shadow-sm transition bouncy';
                btn.textContent = choice;
                btn.onclick = () => checkQuizAnswer(choice, correctAnswer, btn);
                optionsContainer.appendChild(btn);
            });

            setTimeout(() => speakText(currentQuizItem.kana), 300);
        }

        function speakCurrentQuizKana() {
            if (currentQuizItem) {
                speakText(currentQuizItem.kana);
            }
        }

        function checkQuizAnswer(selected, correct, btnElement) {
            const feedback = document.getElementById('quizFeedback');
            feedback.classList.remove('hidden');

            if (selected === correct) {
                playSound('correct');
                quizScore += 10;
                document.getElementById('quizScore').textContent = quizScore;

                feedback.className = 'text-emerald-700 bg-emerald-100 border-2 border-emerald-300 text-2xl md:text-3xl font-black py-3 rounded-2xl block';
                feedback.innerHTML = '🎉 せいかい！ すごいね！';

                btnElement.classList.remove('bg-emerald-50', 'border-emerald-200');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');

                document.querySelectorAll('#quizOptions button').forEach(b => b.disabled = true);

                setTimeout(() => {
                    loadNextQuizQuestion();
                }, 1200);

            } else {
                playSound('wrong');
                feedback.className = 'text-rose-700 bg-rose-100 border-2 border-rose-300 text-2xl md:text-3xl font-black py-3 rounded-2xl block';
                feedback.innerHTML = '❌ ざんねん！ もういちど！';

                btnElement.classList.remove('bg-emerald-50');
                btnElement.classList.add('bg-rose-200', 'text-rose-800', 'border-rose-300');
            }
        }

        function resetQuiz() {
            quizScore = 0;
            document.getElementById('quizScore').textContent = quizScore;
            loadNextQuizQuestion();
        }

        let currentWordIndex = 0;
        let typingTargetRomaji = "";
        let typedInput = "";
        let typingScore = 0;

        function setupTypingWord() {
            const wordObj = wordsData[currentWordIndex];
            document.getElementById('typingIcon').textContent = wordObj.icon;
            document.getElementById('typingKana').textContent = wordObj.kana;

            typingTargetRomaji = formatRomaji(wordObj.romaji);
            typedInput = "";

            renderTypingSlots();
            renderOnScreenKeyboard();

            speakText(wordObj.kana);
        }

        function renderTypingSlots() {
            const container = document.getElementById('romajiSlots');
            container.innerHTML = '';

            for (let i = 0; i < typingTargetRomaji.length; i++) {
                const charBox = document.createElement('div');
                const targetChar = typingTargetRomaji[i];
                const isTyped = i < typedInput.length;
                const isCurrent = i === typedInput.length;

                charBox.className = `font-romaji w-14 h-16 md:w-20 md:h-24 rounded-2xl font-black text-4xl md:text-6xl flex items-center justify-center border-2 md:border-3 transition-all ${
                    isTyped 
                        ? 'bg-blue-500 text-white border-blue-600 shadow-md' 
                        : isCurrent 
                        ? 'bg-amber-100 text-amber-800 border-amber-400 animate-pulse scale-105' 
                        : 'bg-slate-100 text-slate-300 border-slate-200'
                }`;

                charBox.textContent = isTyped ? typedInput[i] : (isCurrent ? '?' : targetChar);
                container.appendChild(charBox);
            }
        }

        function handleTypingInput(char) {
            const formattedChar = formatRomaji(char);
            const nextExpectedChar = typingTargetRomaji[typedInput.length];

            if (formattedChar === nextExpectedChar) {
                playSound('tap');
                typedInput += formattedChar;
                renderTypingSlots();

                if (typedInput === typingTargetRomaji) {
                    playSound('correct');
                    typingScore++;
                    document.getElementById('typingScore').textContent = typingScore;

                    setTimeout(() => {
                        nextTypingWord();
                    }, 800);
                }
            } else {
                playSound('wrong');
            }
        }

        function nextTypingWord() {
            currentWordIndex = (currentWordIndex + 1) % wordsData.length;
            setupTypingWord();
        }

        function renderOnScreenKeyboard() {
            const container = document.getElementById('onScreenKeyboard');
            container.innerHTML = '';

            const alphabet = "abcdefghijklmnopqrstuvwxyz".split('');
            alphabet.forEach(letter => {
                const formattedKey = formatRomaji(letter);
                const keyBtn = document.createElement('button');
                keyBtn.className = 'font-romaji bg-slate-100 hover:bg-blue-100 active:bg-blue-500 active:text-white border-2 border-slate-200 text-slate-800 font-black py-3 md:py-4 rounded-2xl shadow-sm text-lg md:text-2xl bouncy';
                keyBtn.textContent = formattedKey;
                keyBtn.onclick = () => handleTypingInput(formattedKey);
                container.appendChild(keyBtn);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (!document.getElementById('contentTyping').classList.contains('hidden')) {
                if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                    handleTypingInput(e.key);
                }
            }
        });

        window.onload = () => {
            renderChart('seion');
        };
    </script>
</body>
</html>
